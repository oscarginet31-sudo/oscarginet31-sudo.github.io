<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — Oscar Ginet</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Source du CV PDF. Le contenu vient de assets/js/data/content.js (le même
  que le portfolio). Pour régénérer les PDF : python3 tools/build_cv.py
  ?lang=fr (défaut) ou ?lang=en
-->
<style>
  @page { size: A4; margin: 0; }
  :root {
    --navy: #15293f; --blue: #1d3a5f; --blue-2: #2d5687; --accent: #bf6a39;
    --cream: #f1e8d6; --ink: #1c1f26; --soft: #4a4f5a; --muted: #8a8f9a; --line: #e4ded2;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Geist', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: var(--sans); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @media screen { body { background: #e9e5dc; padding: 24px 0; } .page { margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,.15); } }

  .page { width: 210mm; height: 297mm; display: grid; grid-template-columns: 66mm 1fr; overflow: hidden; background: #fff; }

  /* --- Colonne latérale ------------------------------------------------ */
  .side { background: var(--navy); color: var(--cream); padding: 15mm 7mm 10mm 9mm; display: flex; flex-direction: column; gap: 6.2mm; }
  .side h2 { font-family: var(--mono); font-size: 7pt; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: #f0b48a; margin-bottom: 2.4mm; display: flex; align-items: center; gap: 2.4mm; }
  .side h2::after { content: ""; flex: 1; height: .3mm; background: rgba(241, 232, 214, .2); }
  .contact { list-style: none; display: grid; gap: 1.7mm; font-size: 8.2pt; line-height: 1.35; }
  .contact span { display: block; font-family: var(--mono); font-size: 6.3pt; letter-spacing: .12em; color: rgba(241, 232, 214, .55); text-transform: uppercase; }
  .contact a { color: var(--cream); text-decoration: none; word-break: break-word; }
  .skills { display: grid; gap: 2.3mm; }
  .skills h3 { font-family: var(--serif); font-weight: 400; font-size: 11pt; line-height: 1.1; }
  .skills p { font-size: 7.6pt; line-height: 1.42; color: rgba(241, 232, 214, .8); margin-top: .6mm; }
  .certs { list-style: none; display: grid; gap: 1.8mm; }
  .certs b { display: block; font-size: 8pt; font-weight: 500; line-height: 1.3; }
  .certs span { display: block; font-family: var(--mono); font-size: 6.6pt; line-height: 1.35; color: rgba(241, 232, 214, .6); margin-top: .3mm; }
  .langs { list-style: none; display: grid; gap: 1.2mm; font-size: 8pt; }
  .langs span { color: rgba(241, 232, 214, .62); }
  .interests { list-style: none; display: grid; gap: 1.4mm; font-size: 7.6pt; line-height: 1.4; color: rgba(241, 232, 214, .82); }

  /* --- Colonne principale ---------------------------------------------- */
  .main { padding: 12mm 12mm 8mm 11mm; display: flex; flex-direction: column; gap: 4mm; }
  .head .name { font-family: var(--serif); font-weight: 400; font-size: 38pt; line-height: .92; letter-spacing: -.02em; }
  .head .name em { color: var(--blue-2); }
  .head .role { margin-top: 2.6mm; font-family: var(--mono); font-size: 8pt; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .head .sub { margin-top: 1.2mm; font-size: 8.6pt; color: var(--soft); }
  .summary { font-size: 8.8pt; line-height: 1.5; color: var(--soft); border-left: .6mm solid var(--accent); padding-left: 3.2mm; }

  .main h2 { font-family: var(--mono); font-size: 7.4pt; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 2.6mm; margin-bottom: 2.4mm; }
  .main h2::after { content: ""; flex: 1; height: .3mm; background: var(--line); }

  .job + .job { margin-top: 2.4mm; }
  .job-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
  .job h3 { font-family: var(--serif); font-weight: 400; font-size: 13.5pt; line-height: 1.1; }
  .date { font-family: var(--mono); font-size: 7pt; color: var(--accent); white-space: nowrap; }
  .org { font-family: var(--mono); font-size: 7.2pt; color: var(--soft); margin-top: .6mm; }
  .org b { color: var(--ink); font-weight: 500; }
  .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6mm 5mm; margin-top: 2mm; }
  .groups h4 { font-family: var(--mono); font-size: 6.6pt; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); margin-bottom: .7mm; }
  ul.dots { list-style: none; display: grid; gap: .6mm; }
  ul.dots li { position: relative; padding-left: 3mm; font-size: 7.9pt; line-height: 1.4; color: var(--soft); }
  ul.dots li::before { content: ""; position: absolute; left: .4mm; top: 1.55mm; width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--accent); }
  .desc { font-size: 8.1pt; line-height: 1.45; color: var(--soft); margin-top: 1mm; }
  .domains { display: flex; flex-wrap: wrap; gap: 1.4mm; margin-top: 1.8mm; }
  .domains span { font-family: var(--mono); font-size: 6.6pt; color: var(--blue); background: #f4efe4; border: .25mm solid var(--line); border-radius: 9px; padding: .5mm 2mm; }

  .projects { list-style: none; display: grid; gap: 1.7mm; }
  .projects b { font-size: 8.6pt; font-weight: 600; color: var(--ink); }
  .projects b em { font-style: normal; font-family: var(--mono); font-size: 6.4pt; font-weight: 500; color: var(--accent); border: .25mm solid rgba(191, 106, 57, .5); border-radius: 9px; padding: .2mm 1.4mm; margin-left: 1.4mm; vertical-align: 1px; }
  .projects p { font-size: 7.9pt; line-height: 1.42; color: var(--soft); margin-top: .4mm; }
  .projects .tech { font-family: var(--mono); font-size: 6.5pt; color: var(--muted); margin-top: .4mm; }
  .iut { font-size: 7.9pt; line-height: 1.42; color: var(--soft); margin-top: 2.2mm; }
  .iut b { color: var(--ink); font-weight: 600; }

  .edu { list-style: none; display: grid; gap: 1.8mm; }
  .edu li { display: grid; grid-template-columns: 20mm 1fr; gap: 3mm; }
  .edu b { font-size: 8.6pt; font-weight: 600; }
  .edu p { font-size: 7.8pt; color: var(--soft); line-height: 1.4; }

  .foot { margin-top: auto; font-family: var(--mono); font-size: 6.6pt; color: var(--muted); display: flex; justify-content: space-between; border-top: .3mm solid var(--line); padding-top: 2mm; }
</style>
</head>
<body>
<div class="page">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>

<script src="assets/js/data/content.js"></script>
<script src="assets/js/ui/i18n.js"></script>
<script>
(function (PF) {
  "use strict";
  // Langue imposée par l'URL (?lang=en), indépendamment des préférences du navigateur.
  PF.lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr";
  document.documentElement.lang = PF.lang;
  const C = PF.CONTENT, tx = PF.tx, fr = PF.lang === "fr";
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  const L = (f, e) => (fr ? f : e);
  document.title = L("CV — Oscar Ginet", "Resume — Oscar Ginet");

  /* --- Colonne latérale --- */
  const links = C.contact.links;
  const contact = [
    [L("Email", "Email"), `<a href="mailto:${esc(C.contact.email)}">${esc(C.contact.email)}</a>`],
    [L("Téléphone", "Phone"), `<a href="tel:+33685330014">${esc(L(links[1].value, "+33 6 85 33 00 14"))}</a>`],
    ["LinkedIn", `<a href="${esc(links[2].href)}">linkedin.com/in/oscar-ginet-6523862b3</a>`],
    [L("Basé", "Based"), esc(tx(C.identity.location))],
    [L("Mobilité", "Mobility"), esc(L("Permis B · véhicule personnel", "Driving licence · own car"))],
  ];
  document.getElementById("side").innerHTML = `
    <section><h2>${L("Contact", "Contact")}</h2>
      <ul class="contact">${contact.map(([k, v]) => `<li><span>${k}</span>${v}</li>`).join("")}</ul></section>
    <section><h2>${L("Compétences", "Skills")}</h2>
      <div class="skills">${C.skills.categories.map((c) => `
        <div><h3>${esc(tx(c.name))}</h3><p>${c.items.map((i) => esc(tx(i.name))).join(" · ")}</p></div>`).join("")}</div></section>
    <section><h2>${L("Certifications", "Certifications")}</h2>
      <ul class="certs">${C.experience.certifications.map((c) => `
        <li><b>${esc(tx(c.name))}</b><span>${esc(tx(c.issuer))} · ${esc(tx(c.date))}</span></li>`).join("")}</ul></section>
    <section><h2>${L("Langues", "Languages")}</h2>
      <ul class="langs">${C.cv.languages.map((l) => `<li>${esc(tx(l.name))} <span>— ${esc(tx(l.level))}</span></li>`).join("")}</ul></section>
    <section><h2>${L("Centres d’intérêt", "Interests")}</h2>
      <ul class="interests">${C.cv.interests.map((i) => `<li>${esc(tx(i))}</li>`).join("")}</ul></section>`;

  /* --- Colonne principale --- */
  const X = C.experience;
  const lam = X.jobs[0], farm = X.jobs[1];
  const reserve = C.engagement.items.find((e) => e.featured);
  const pro = C.projects.items.filter((p) => p.ctx === "pro");
  const iut = C.projects.items.filter((p) => p.ctx === "iut");

  document.getElementById("main").innerHTML = `
    <header class="head">
      <h1 class="name">Oscar <em>Ginet</em></h1>
      <p class="role">${esc(tx(C.identity.role))}</p>
      <p class="sub">${esc(L("BUT Réseaux & Télécommunications parcours Cybersécurité · IUT d’Annecy · alternance jusqu’en juillet 2027",
                            "BUT Networks & Telecommunications, Cybersecurity track · IUT Annecy · apprenticeship until July 2027"))}</p>
    </header>
    <p class="summary">${esc(tx(C.cv.summary))}</p>

    <section><h2>${L("Expérience", "Experience")}</h2>
      <article class="job">
        <div class="job-top"><h3>${esc(tx(lam.title))}</h3><span class="date">${esc(tx(lam.date))}</span></div>
        <p class="org"><b>${esc(tx(lam.org))}</b> · ${esc(tx(lam.meta))}</p>
        <p class="desc">${esc(tx(lam.desc))}</p>
        <p class="domains">${lam.groups.map((g) => `<span>${esc(tx(g.label))}</span>`).join("")}</p>
      </article>
      <article class="job">
        <div class="job-top"><h3>${esc(tx(reserve.title))}</h3><span class="date">${esc(L("Juil. 2026 — aujourd’hui", "Jul 2026 — present"))}</span></div>
        <p class="org"><b>${esc(L("Armée de Terre", "French Army"))}</b> · ${esc(L("engagement de 5 ans · troupes de montagne · en parallèle de l’alternance", "5-year commitment · mountain troops · alongside the apprenticeship"))}</p>
      </article>
      <article class="job">
        <div class="job-top"><h3>${esc(tx(farm.title))}</h3><span class="date">${esc(tx(farm.date))}</span></div>
        <p class="org"><b>${esc(tx(farm.org))}</b> · ${esc(tx(farm.meta))}</p>
      </article>
    </section>

    <section><h2>${L("Projets en entreprise", "Projects on the job")}</h2>
      <ul class="projects">${pro.map((p) => `
        <li><b>${esc(tx(p.title))}${p.badge ? `<em>${esc(tx(p.badge))}</em>` : ""}</b>
          <p>${esc(tx(p.desc))}</p>
          <p class="tech">${p.env.map(esc).join(" · ")}</p></li>`).join("")}</ul>
      <p class="iut"><b>${L("À l’IUT :", "At university:")}</b> ${iut.map((p) => `${esc(tx(p.title))} (${esc(tx(p.badge))}, ${p.env.slice(0, 3).map(esc).join(", ")})`).join(" · ")}.</p>
    </section>

    <section><h2>${L("Formation", "Education")}</h2>
      <ul class="edu">${X.education.map((e, i) => `
        <li><span class="date">${esc(e.date)}</span><div><b>${esc(tx(e.title))}</b><p>${esc(tx(e.org))}${tx(e.desc) && i > 0 ? " — " + esc(tx(e.desc)) : ""}</p></div></li>`).join("")}</ul>
    </section>

    <p class="foot"><span>${esc(L("Portfolio interactif : galaxie 3D et version classique — lien sur mon profil LinkedIn", "Interactive portfolio: 3D galaxy and classic version — link on my LinkedIn profile"))}</span><span>${new Date().getFullYear()}</span></p>`;
})(window.PF);
</script>
</body>
</html>
