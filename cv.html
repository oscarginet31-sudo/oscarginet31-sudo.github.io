<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Sécurité : aucune ressource tierce, aucun script en ligne, aucun référent envoyé aux sites externes. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>CV — Oscar Ginet</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/fonts.css">
<!--
  Source du CV PDF. Le contenu vient de assets/js/data/content.js (le même
  que le portfolio). Pour régénérer les PDF : python3 tools/build_cv.py
  ?lang=fr (défaut) ou ?lang=en
-->
<style>
  /* CV pensé pour être lu en quelques secondes : l'essentiel en gras, le détail ensuite. */
  @page { size: A4; margin: 0; }
  :root {
    --navy: #15293f; --blue-2: #2d5687; --accent: #b0582a; --peach: #f0b48a;
    --cream: #f6f1e7; --ink: #1c1f26; --soft: #4a4f5a; --muted: #7d828c; --line: #e4ded2;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Geist', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: var(--sans); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @media screen { body { background: #e9e5dc; padding: 24px 0; } .page { margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,.15); } }
  b { font-weight: 600; color: var(--ink); }

  .page { position: relative; width: 210mm; height: 297mm; overflow: hidden; background: #fff;
          padding: 16mm 15mm 11mm; display: flex; flex-direction: column; gap: 6.5mm; }
  .page::before { content: ""; position: absolute; inset: 0 0 auto; height: 2.6mm;
                  background: linear-gradient(90deg, var(--navy), var(--blue-2) 55%, var(--accent)); }

  /* --- En-tête --- */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 8mm; }
  .top h1 { font-family: var(--serif); font-weight: 400; font-size: 44pt; line-height: .88; letter-spacing: -.02em; }
  .top h1 em { color: var(--blue-2); }
  .role { margin-top: 3.4mm; font-family: var(--mono); font-size: 8.4pt; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .now { margin-top: 1.4mm; font-size: 10pt; color: var(--soft); }
  .role + .now { margin-top: 2mm; }
  .contact { list-style: none; text-align: right; font-size: 9pt; line-height: 1.65; color: var(--soft); white-space: nowrap; }
  .contact a { color: var(--ink); text-decoration: none; }

  /* --- Objectif : la ligne la plus importante --- */
  .goal { background: var(--navy); color: #e9e1d2; border-radius: 3mm; padding: 3.6mm 5mm; font-size: 10.6pt; line-height: 1.45; }
  .goal span { font-family: var(--mono); font-size: 7.4pt; letter-spacing: .16em; text-transform: uppercase; color: var(--peach); margin-right: 2.6mm; }
  .goal b { color: #fff; }

  .cols { display: grid; grid-template-columns: 1fr 57mm; gap: 9mm; align-items: start; }
  h2 { font-family: var(--mono); font-size: 8pt; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
       display: flex; align-items: center; gap: 3mm; margin-bottom: 3.4mm; }
  h2::after { content: ""; flex: 1; height: .3mm; background: var(--line); }
  section + section { margin-top: 7mm; }

  /* --- Expérience --- */
  .job + .job { margin-top: 5mm; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
  .job h3 { font-size: 11.6pt; font-weight: 600; }
  .date { font-family: var(--mono); font-size: 7.8pt; color: var(--muted); white-space: nowrap; }
  .org { margin-top: .8mm; font-size: 9pt; color: var(--soft); }
  ul.hl { list-style: none; margin-top: 3mm; display: grid; gap: 2mm; }
  ul.hl li { position: relative; padding-left: 4.4mm; font-size: 9.6pt; line-height: 1.45; color: var(--soft); }
  ul.hl li::before { content: ""; position: absolute; left: .6mm; top: 2.1mm; width: 1.6mm; height: 1.6mm; border-radius: 50%; background: var(--accent); }

  /* --- Formation --- */
  .edu { list-style: none; display: grid; gap: 3.4mm; }
  .edu li { display: grid; grid-template-columns: 21mm 1fr; gap: 3mm; }
  .edu .date { padding-top: .8mm; }
  .edu h3 { font-size: 10.2pt; font-weight: 600; line-height: 1.3; }
  .edu h3 em { font-style: normal; font-family: var(--mono); font-size: 7pt; font-weight: 500; color: var(--accent);
               border: .25mm solid rgba(176, 88, 42, .45); border-radius: 9px; padding: .3mm 1.8mm; margin-left: 1.6mm; vertical-align: 1.5px; white-space: nowrap; }
  .edu p { margin-top: .5mm; font-size: 8.8pt; color: var(--soft); }

  /* --- Encadré latéral --- */
  .side { background: var(--cream); border-radius: 3mm; padding: 5.5mm 5mm; }
  .side section + section { margin-top: 5.5mm; }
  .kv { list-style: none; display: grid; gap: 2.4mm; }
  .kv b { display: block; font-size: 9.2pt; }
  .kv span { display: block; font-size: 8.5pt; line-height: 1.4; color: var(--soft); }
  .kv.line { gap: 1.6mm; }
  .kv.line li { display: flex; justify-content: space-between; align-items: baseline; gap: 2mm; }
  .kv.line span { font-size: 8.3pt; text-align: right; }
  .hobbies { font-size: 8.6pt; line-height: 1.5; color: var(--soft); }

  /* --- Pied de page --- */
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 6mm;
          border-top: .3mm solid var(--line); padding-top: 3mm; font-size: 9pt; color: var(--soft); }
  .foot a { font-family: var(--mono); font-size: 8.6pt; color: var(--blue-2); text-decoration: none; }
</style>
</head>
<body>
<div class="page" id="cv"></div>

<script src="assets/js/data/content.js"></script>
<script src="assets/js/ui/i18n.js"></script>
<script src="assets/js/cv.js"></script>
</body>
</html>
